<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QGG Election Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #221B2C;
    --purple: #3E2352;
    --purple-deep: #2A1738;
    --gold: #B4923F;
    --gold-light: #E4D3A0;
    --paper: #F7F4EC;
    --paper-line: #DDD5C3;
    --panel: #FFFEFA;
    --red: #8C3B33;
    --green: #3F6B4A;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .frame { max-width: 560px; margin: 0 auto; padding: 28px 20px 60px; }
  .crest { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .crest-mark {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--purple); border: 2px solid var(--gold);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    color: var(--gold-light); font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 15px;
  }
  .crest-text .eyebrow { color: var(--purple); font-size: 12px; letter-spacing: 0.02em; margin: 0 0 2px; }
  .crest-text h1 { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 22px; margin: 0; color: var(--ink); }
  .panel {
    background: var(--panel); border: 1px solid var(--paper-line); border-top: 3px solid var(--purple);
    border-radius: var(--radius); padding: 26px 24px; margin-bottom: 18px;
  }
  .panel h2 { font-family: 'Source Serif 4', serif; font-size: 18px; font-weight: 600; margin: 0 0 6px; color: var(--purple-deep); }
  .sub { color: #5B5464; font-size: 13.5px; margin: 0 0 18px; }
  .hr { border: none; border-top: 1px solid var(--paper-line); margin: 18px 0; }
  label.field-label { display: block; font-size: 12.5px; color: #55506099; font-weight: 600; margin-bottom: 5px; }
  input[type=text], input[type=password], textarea {
    width: 100%; font-family: inherit; font-size: 15px; padding: 10px 11px;
    border: 1px solid #C9C0AF; border-radius: var(--radius); background: #fff; color: var(--ink); margin-bottom: 14px;
  }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  textarea { min-height: 90px; resize: vertical; font-family: 'IBM Plex Sans', monospace; }
  button {
    font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 14.5px; padding: 11px 18px;
    border-radius: var(--radius); border: 1px solid var(--purple); background: var(--purple); color: #fff; cursor: pointer;
  }
  button:hover { background: var(--purple-deep); }
  button.ghost { background: transparent; color: var(--purple); }
  button.ghost:hover { background: #EFE9DD; }
  button.subtle {
    background: transparent; border-color: #C9C0AF; color: #5B5464; font-weight: 500; font-size: 13px; padding: 6px 12px;
  }
  button.small { font-size: 12.5px; padding: 6px 11px; }
  button.danger { border-color: var(--red); background: var(--red); }
  button.danger:hover { background: #6E2C26; }
  button.warn { border-color: var(--gold); background: var(--gold); color: var(--ink); }
  button.warn:hover { background: #9E7F35; color: #fff; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .row.tight > * { flex: none; }
  .choice-list { list-style: none; margin: 0 0 16px; padding: 0; }
  .choice {
    display: flex; align-items: center; gap: 11px; border: 1px solid #DAD2C0; border-radius: var(--radius);
    padding: 12px 13px; margin-bottom: 8px; cursor: pointer; background: #fff; transition: border-color 0.12s, background 0.12s;
  }
  .choice:hover { border-color: var(--gold); }
  .choice.selected { border-color: var(--purple); background: #F4EFE3; }
  .choice input { margin: 0; accent-color: var(--purple); }
  .choice span { font-size: 14.5px; }
  .status-banner { font-size: 13.5px; padding: 10px 13px; border-radius: var(--radius); margin-bottom: 16px; }
  .status-banner.error { background: #F7E8E6; color: var(--red); border: 1px solid #E0BAB4; }
  .status-banner.ok { background: #E9F1EA; color: var(--green); border: 1px solid #BFDAC4; }
  .status-banner.info { background: #F1ECDD; color: #6B5A2C; border: 1px solid #E4D3A0; }
  .office-block { margin-bottom: 22px; }
  .office-block:last-child { margin-bottom: 0; }
  .office-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .office-title { font-family: 'Source Serif 4', serif; font-size: 16px; font-weight: 600; margin: 0; }
  .office-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin-left: 8px; vertical-align: middle;
  }
  .tag.live { background: #E9F1EA; color: var(--green); }
  .tag.draft { background: #EFE9DD; color: #8A7B4F; }
  .tag.closed { background: #EFE4E2; color: var(--red); }
  .bar-row { margin-bottom: 10px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 3px; }
  .bar-track { height: 8px; background: #EDE7D8; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--purple); border-radius: 4px; }
  .bar-fill.winner { background: var(--gold); }
  .tally-note { font-size: 12.5px; color: #5B5464; margin-top: 6px; }
  .code-list {
    font-family: 'IBM Plex Sans', monospace; font-size: 13.5px; background: #F4EFE3; border: 1px solid #DAD2C0;
    border-radius: var(--radius); padding: 12px 13px; max-height: 260px; overflow: auto; margin-bottom: 12px;
    display: flex; gap: 22px;
  }
  .code-col {
    display: flex; flex-direction: column; gap: 4px;
  }
  .code-col span {
    white-space: nowrap;
  }
  .link-btn {
    background: none; border: none; color: var(--purple); font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline;
  }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .center { text-align: center; }
  .seal {
    width: 62px; height: 62px; border-radius: 50%; background: var(--purple); border: 3px solid var(--gold);
    display: flex; align-items: center; justify-content: center; margin: 6px auto 14px; color: var(--gold-light); font-size: 24px;
    animation: stamp 0.35s ease;
  }
  @keyframes stamp { 0% { transform: scale(1.5); opacity: 0; } 60% { transform: scale(0.95); opacity: 1; } 100% { transform: scale(1); } }
  .footer-note { font-size: 12px; color: #857D8D; text-align: center; margin-top: 24px; }
  @media (prefers-reduced-motion: reduce) { .seal { animation: none; } }
</style>
</head>
<body>
<div class="frame">
  <div class="crest">
    <div class="crest-mark">ΩΓΓ</div>
    <div class="crest-text">
      <p class="eyebrow" id="chapterLine">QGG Election Tool</p>
      <h1 id="titleLine">Chapter Election</h1>
    </div>
  </div>
  <div id="app"></div>
  <p class="footer-note">Ballots are recorded without any link to voter identity. Voting codes confirm eligibility only.</p>
</div>

<script type="module">
/* ---- Firebase setup ----
   1. Go to https://console.firebase.google.com, create a free project.
   2. In the project, click "Firestore Database" → Create database → start in production mode (rules are set below).
   3. Click the gear icon → Project settings → scroll to "Your apps" → click the </> (web) icon → register an app (no hosting needed).
   4. Copy the firebaseConfig object it gives you and paste it in place of the placeholder below.
   5. In Firestore → Rules, paste the rules block from the message this file was delivered with, then Publish.
*/
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCJJ6Zn4tMfceLKln0pD13F2NWlEGtWIso",
  authDomain: "qgg-election.firebaseapp.com",
  projectId: "qgg-election",
  storageBucket: "qgg-election.firebasestorage.app",
  messagingSenderId: "191379424498",
  appId: "1:191379424498:web:902cb3f851bbe3c25a7c6b"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const COLLECTION = 'qgg_election';

const CONFIG_KEY = 'config';
const CODES_KEY = 'codes';
const USAGE_KEY = 'usage';

let adminAuthed = false;
let voterCode = null;
let voterChoice = null;
let adminBanner = null;
let resetPending = false;
let clearPendingOfficeId = null;

const app = document.getElementById('app');

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function randCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

async function getJSON(docId, fallback) {
  try {
    const snap = await getDoc(doc(db, COLLECTION, docId));
    return snap.exists() ? snap.data().value : fallback;
  } catch (e) {
    console.error('Firestore read failed:', e);
    return fallback;
  }
}
async function setJSON(docId, value) {
  try {
    await setDoc(doc(db, COLLECTION, docId), { value });
    return true;
  } catch (e) {
    console.error('Firestore write failed:', e);
    return false;
  }
}
async function deleteKey(docId) {
  try { await deleteDoc(doc(db, COLLECTION, docId)); } catch (e) {}
}

async function loadConfig() { return await getJSON(CONFIG_KEY, null); }
async function loadCodes() { return await getJSON(CODES_KEY, {}); }
async function loadUsage() { return await getJSON(USAGE_KEY, {}); }
async function loadVotes(officeId) { return await getJSON('votes_' + officeId, []); }

function render(html) { app.innerHTML = html; }

function updateHeader(config) {
  document.getElementById('titleLine').textContent = config && config.title ? config.title : 'Chapter Election';
  document.getElementById('chapterLine').textContent = 'QGG Election Tool';
}

// ---------- HOME ----------
async function showHome() {
  voterCode = null;
  voterChoice = null;
  const config = await loadConfig();
  updateHeader(config);
  if (!config) {
    render(`
      <div class="panel center">
        <h2>No election set up yet</h2>
        <p class="sub">Create one to begin generating voter codes and collecting ballots.</p>
        <button onclick="showAdminSetup()">Set up election</button>
      </div>
    `);
    return;
  }
  render(`
    <div class="panel center">
      <h2>${esc(config.title)}</h2>
      <p class="sub">Voting portal is <strong>${config.status === 'live' ? 'open' : config.status === 'closed' ? 'closed' : 'not yet open'}</strong>. Offices open one at a time — the administrator controls which office is currently being voted on.</p>
      <div class="stack">
        <button onclick="showVoterEntry()">I have a voting code</button>
        <button class="ghost" onclick="showAdminGate()">Election administrator</button>
      </div>
    </div>
  `);
}

// ---------- ADMIN SETUP ----------
function showAdminSetup(errorMsg) {
  render(`
    <div class="panel">
      <h2>Set up the ballot</h2>
      <p class="sub">This creates a shared ballot that everyone with the link can access.</p>
      ${errorMsg ? `<div class="status-banner error">${esc(errorMsg)}</div>` : ''}
      <label class="field-label">Election title</label>
      <input type="text" id="setupTitle" placeholder="e.g. QGG Officer Elections — September 2026">
      <label class="field-label">Administrator passphrase</label>
      <input type="password" id="setupPass" placeholder="Only you and tellers need this">
      <p class="sub" style="margin-top:-8px;">Used to reopen the admin panel later. Not encrypted — don't reuse a sensitive password.</p>
      <div class="row">
        <button onclick="submitAdminSetup()">Create election</button>
        <button class="ghost" onclick="showHome()">Cancel</button>
      </div>
    </div>
  `);
}

async function submitAdminSetup() {
  const title = document.getElementById('setupTitle').value.trim();
  const pass = document.getElementById('setupPass').value;
  if (!title || !pass) { showAdminSetup('Enter both a title and a passphrase.'); return; }
  const config = { title, passphrase: pass, status: 'draft', offices: [] };
  const res = await setJSON(CONFIG_KEY, config);
  if (!res) { showAdminSetup('Could not save — check your connection and try again.'); return; }
  adminAuthed = true;
  showAdminPanel();
}

// ---------- ADMIN GATE ----------
function showAdminGate(errorMsg) {
  render(`
    <div class="panel">
      <h2>Administrator sign-in</h2>
      ${errorMsg ? `<div class="status-banner error">${esc(errorMsg)}</div>` : ''}
      <label class="field-label">Passphrase</label>
      <input type="password" id="gatePass">
      <div class="row">
        <button onclick="submitAdminGate()">Enter</button>
        <button class="ghost" onclick="showHome()">Back</button>
      </div>
    </div>
  `);
}

async function submitAdminGate() {
  const pass = document.getElementById('gatePass').value;
  const config = await loadConfig();
  if (config && config.passphrase === pass) {
    adminAuthed = true;
    showAdminPanel();
  } else { showAdminGate('Incorrect passphrase.'); }
}

// ---------- ADMIN PANEL ----------
async function showAdminPanel() {
  if (!adminAuthed) { showAdminGate(); return; }
  const config = await loadConfig();
  updateHeader(config);
  const codes = await loadCodes();
  const codeCount = Object.keys(codes).length;
  const bannerToShow = adminBanner;
  adminBanner = null;

  let officesHTML = '';
  for (const office of config.offices) {
    const tally = await computeTally(office.id);
    officesHTML += renderAdminOffice(office, tally);
  }

  render(`
    ${bannerToShow ? `<div class="status-banner ok">${esc(bannerToShow)}</div>` : ''}
    <div class="panel">
      <h2>${esc(config.title)} <span class="tag ${config.status === 'live' ? 'live' : config.status === 'closed' ? 'closed' : 'draft'}">${config.status === 'live' ? 'Portal open' : config.status === 'closed' ? 'Closed' : 'Draft'}</span></h2>
      <p class="sub">${codeCount} voting code${codeCount === 1 ? '' : 's'} issued. Opening the portal lets voters enter their code; you still open and close each office individually below so only one is live at a time.</p>
      <div class="row">
        ${config.status !== 'live' ? `<button onclick="openPortal()">Open voting portal</button>` : `<button class="danger" onclick="closePortal()">Close voting portal</button>`}
        <button class="ghost" onclick="showHome()">Exit admin</button>
      </div>
    </div>

    <div class="panel">
      <h2>Offices</h2>
      <p class="sub">Add each office and its nominees. Then, when it's time to vote on one, open just that office — close it when done and open the next.</p>
      ${config.offices.length === 0 ? '<p class="sub">No offices added yet.</p>' : ''}
      <div id="officeForm" class="stack" style="margin-bottom:14px;">
        <input type="text" id="newOfficeName" placeholder="Office name, e.g. Basileus">
        <textarea id="newOfficeCandidates" placeholder="One nominee per line"></textarea>
        <button class="ghost" onclick="addOffice()">Add office</button>
      </div>
      <hr class="hr">
      ${officesHTML || ''}
    </div>

    <div class="panel">
      <h2>Voting codes</h2>
      <p class="sub">Generate one code per eligible financial member and distribute individually. Codes stay valid across every office — clearing an office's ballot does not touch the codes.</p>
      <div class="row">
        <input type="text" id="codeGenCount" value="10" style="max-width:90px;">
        <button class="ghost" onclick="generateCodes()">Generate codes</button>
      </div>
      ${codeCount > 0 ? renderCodeColumns(Object.keys(codes)) : ''}
    </div>

    <div class="panel">
      ${!resetPending
        ? `<button class="subtle" onclick="requestReset()">Reset entire election (deletes codes and all data)</button>`
        : `<div class="status-banner error">
             This permanently deletes the election, every office, all codes, and all votes. There's no undo.
             <div class="row tight" style="margin-top:10px;">
               <button class="small danger" onclick="doReset()">Yes, delete everything</button>
               <button class="small ghost" onclick="cancelReset()">Cancel</button>
             </div>
           </div>`}
    </div>
  `);
}

function renderCodeColumns(codeList) {
  const perCol = 10;
  const cols = [];
  for (let i = 0; i < codeList.length; i += perCol) {
    cols.push(codeList.slice(i, i + perCol));
  }
  const colsHTML = cols.map(col =>
    `<div class="code-col">${col.map(c => `<span>${esc(c)}</span>`).join('')}</div>`
  ).join('');
  return `<div class="code-list">${colsHTML}</div>`;
}

function renderAdminOffice(office, tally) {
  const rows = tally.counts.map(c => {
    const pct = tally.total ? Math.round((c.count / tally.total) * 100) : 0;
    const isWinner = tally.majorityWinner === c.name;
    return `
      <div class="bar-row">
        <div class="bar-label"><span>${esc(c.name)}</span><span>${c.count} vote${c.count === 1 ? '' : 's'} (${pct}%)</span></div>
        <div class="bar-track"><div class="bar-fill ${isWinner ? 'winner' : ''}" style="width:${pct}%;"></div></div>
      </div>`;
  }).join('');

  let noteHTML = '';
  if (tally.total === 0) {
    noteHTML = `<p class="tally-note">No ballots cast yet.</p>`;
  } else if (tally.majorityWinner) {
    noteHTML = `<p class="tally-note">Majority reached — <strong>${esc(tally.majorityWinner)}</strong> elected.</p>`;
  } else {
    noteHTML = `<p class="tally-note">No majority. Run-off needed between: ${tally.runoffCandidates.map(esc).join(', ')}.
      <button class="link-btn" onclick='createRunoff("${office.id}", ${JSON.stringify(tally.runoffCandidates)})'>Create run-off office</button></p>`;
  }

  const isLive = office.status === 'live';
  const clearing = clearPendingOfficeId === office.id;
  return `
    <div class="office-block">
      <div class="office-head">
        <p class="office-title">${esc(office.name)} <span class="tag ${isLive ? 'live' : office.status === 'closed' ? 'closed' : 'draft'}">${isLive ? 'live now' : office.status === 'closed' ? 'closed' : 'not open'}</span></p>
        <div class="office-actions">
          ${isLive
            ? `<button class="small danger" onclick="closeOffice('${office.id}')">Close</button>`
            : `<button class="small" onclick="openOffice('${office.id}')">Open this office</button>`}
          ${!clearing ? `<button class="small warn" onclick="requestClearOfficeVotes('${office.id}')">Clear ballot</button>` : ''}
        </div>
      </div>
      ${clearing ? `
        <div class="status-banner error">
          Clear all votes for "${esc(office.name)}"? Codes stay valid — voters can vote here again.
          <div class="row tight" style="margin-top:10px;">
            <button class="small danger" onclick="clearOfficeVotes('${office.id}')">Yes, clear it</button>
            <button class="small ghost" onclick="cancelClearOfficeVotes()">Cancel</button>
          </div>
        </div>
      ` : ''}
      ${rows || '<p class="sub">No nominees.</p>'}
      ${noteHTML}
    </div>
  `;
}

async function addOffice() {
  const name = document.getElementById('newOfficeName').value.trim();
  const candLines = document.getElementById('newOfficeCandidates').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!name || candLines.length < 2) {
    adminBanner = null;
    render(`<div class="status-banner error">Enter an office name and at least two nominees, then try again.</div>`);
    setTimeout(showAdminPanel, 1600);
    return;
  }
  const config = await loadConfig();
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + Date.now().toString(36);
  config.offices.push({ id, name, candidates: candLines, status: 'draft' });
  await setJSON(CONFIG_KEY, config);
  showAdminPanel();
}

async function generateCodes() {
  const n = Math.max(1, Math.min(200, parseInt(document.getElementById('codeGenCount').value) || 10));
  const codes = await loadCodes();
  for (let i = 0; i < n; i++) {
    let c;
    do { c = randCode(); } while (codes[c]);
    codes[c] = true;
  }
  await setJSON(CODES_KEY, codes);
  showAdminPanel();
}

async function openPortal() {
  const config = await loadConfig();
  config.status = 'live';
  await setJSON(CONFIG_KEY, config);
  showAdminPanel();
}

async function closePortal() {
  const config = await loadConfig();
  config.status = 'closed';
  config.offices = config.offices.map(o => (o.status === 'live' ? { ...o, status: 'closed' } : o));
  await setJSON(CONFIG_KEY, config);
  showAdminPanel();
}

async function openOffice(officeId) {
  const config = await loadConfig();
  // only one office live at a time
  config.offices = config.offices.map(o => {
    if (o.id === officeId) return { ...o, status: 'live' };
    if (o.status === 'live') return { ...o, status: 'closed' };
    return o;
  });
  if (config.status !== 'live') config.status = 'live';
  await setJSON(CONFIG_KEY, config);
  showAdminPanel();
}

async function closeOffice(officeId) {
  const config = await loadConfig();
  config.offices = config.offices.map(o => o.id === officeId ? { ...o, status: 'closed' } : o);
  await setJSON(CONFIG_KEY, config);
  showAdminPanel();
}

// Step 1: request. Shows an inline "are you sure" in place of the button — no native confirm() dialog.
function requestClearOfficeVotes(officeId) {
  clearPendingOfficeId = officeId;
  showAdminPanel();
}
function cancelClearOfficeVotes() {
  clearPendingOfficeId = null;
  showAdminPanel();
}
// Step 2: clears an office's tally (votes + who has voted on it) but leaves the codes themselves intact.
async function clearOfficeVotes(officeId) {
  const config = await loadConfig();
  const office = config.offices.find(o => o.id === officeId);
  clearPendingOfficeId = null;
  if (!office) { showAdminPanel(); return; }
  try { await deleteKey('votes_' + officeId); } catch (e) {}
  const usage = await loadUsage();
  for (const code of Object.keys(usage)) {
    if (usage[code] && usage[code][officeId]) delete usage[code][officeId];
  }
  await setJSON(USAGE_KEY, usage);
  adminBanner = `Cleared the ballot for "${office.name}". Codes are still valid.`;
  showAdminPanel();
}

async function createRunoff(baseOfficeId, candidates) {
  const config = await loadConfig();
  const base = config.offices.find(o => o.id === baseOfficeId);
  if (!base) return;
  const id = base.id + '-runoff-' + Date.now().toString(36);
  config.offices = config.offices.map(o => o.status === 'live' ? { ...o, status: 'closed' } : o);
  config.offices.push({ id, name: base.name + ' — Run-off', candidates, status: 'live' });
  config.status = 'live';
  await setJSON(CONFIG_KEY, config);
  showAdminPanel();
}

function requestReset() {
  resetPending = true;
  showAdminPanel();
}
function cancelReset() {
  resetPending = false;
  showAdminPanel();
}
async function doReset() {
  resetPending = false;
  try {
    const config = await loadConfig();
    if (config) {
      for (const o of config.offices) {
        try { await deleteKey('votes_' + o.id); } catch (e) {}
      }
    }
    try { await deleteKey(CONFIG_KEY); } catch (e) {}
    try { await deleteKey(CODES_KEY); } catch (e) {}
    try { await deleteKey(USAGE_KEY); } catch (e) {}
  } catch (e) {}
  adminAuthed = false;
  showHome();
}

async function computeTally(officeId) {
  const config = await loadConfig();
  const office = config.offices.find(o => o.id === officeId);
  const votes = await loadVotes(officeId);
  const counts = office.candidates.map(name => ({
    name, count: votes.filter(v => v === name).length
  })).sort((a, b) => b.count - a.count);
  const total = votes.length;
  let majorityWinner = null;
  let runoffCandidates = [];
  if (total > 0) {
    if (counts[0].count > total / 2) {
      majorityWinner = counts[0].name;
    } else {
      const topCount = counts[0].count;
      runoffCandidates = counts.filter(c => c.count === topCount).map(c => c.name);
      if (runoffCandidates.length === 1 && counts[1]) {
        runoffCandidates.push(counts[1].name);
        const secondCount = counts[1].count;
        counts.forEach(c => { if (c.count === secondCount && !runoffCandidates.includes(c.name)) runoffCandidates.push(c.name); });
      }
    }
  }
  return { counts, total, majorityWinner, runoffCandidates };
}

// ---------- VOTER FLOW ----------
function showVoterEntry() {
  render(`
    <div class="panel">
      <h2>Enter your voting code</h2>
      <p class="sub">Your code was issued to you individually. It confirms you're eligible to vote — it is never stored alongside your ballot choices.</p>
      <input type="text" id="voterCodeInput" placeholder="e.g. 7K2QRM" style="text-transform:uppercase;">
      <div class="row">
        <button onclick="submitVoterCode()">Continue</button>
        <button class="ghost" onclick="showHome()">Back</button>
      </div>
    </div>
  `);
}

async function submitVoterCode() {
  const code = document.getElementById('voterCodeInput').value.trim().toUpperCase();
  if (!code) return;
  const codes = await loadCodes();
  if (!codes[code]) {
    render(`<div class="status-banner error">That code wasn't recognized. Check it and try again.</div>`);
    setTimeout(showVoterEntry, 1800);
    return;
  }
  voterCode = code;
  voterChoice = null;
  showVoterBallot();
}

async function showVoterBallot() {
  const config = await loadConfig();
  if (!config || config.status !== 'live') {
    render(`<div class="panel center"><p class="sub">Voting is not currently open.</p><button class="ghost" onclick="showHome()">Back</button></div>`);
    return;
  }
  const usage = await loadUsage();
  const done = (usage[voterCode] || {});
  const office = config.offices.find(o => o.status === 'live');

  if (!office) {
    render(`
      <div class="panel center">
        <p class="sub">No office is currently open for voting. Please wait for the administrator to open the next one.</p>
        <button class="ghost" onclick="showVoterBallot()">Check again</button>
        <button class="ghost" onclick="showHome()">Back</button>
      </div>
    `);
    return;
  }

  if (done[office.id]) {
    render(`
      <div class="panel center">
        <div class="seal">✓</div>
        <h2>Ballot recorded</h2>
        <p class="sub">You've already voted for ${esc(office.name)}. Please wait for the next office to open.</p>
        <button class="ghost" onclick="showVoterBallot()">Check again</button>
        <button class="ghost" onclick="showHome()">Exit</button>
      </div>
    `);
    return;
  }

  const choices = office.candidates.map(c => `
    <li class="choice ${voterChoice === c ? 'selected' : ''}" onclick="selectChoice('${esc(c).replace(/'/g,"\\'")}')">
      <input type="radio" name="office-${office.id}" ${voterChoice === c ? 'checked' : ''} readonly>
      <span>${esc(c)}</span>
    </li>`).join('');

  render(`
    <div class="panel">
      <h2>${esc(office.name)}</h2>
      <p class="sub">Select one nominee, then submit. You can't change your vote once submitted.</p>
      <ul class="choice-list">${choices}</ul>
      <button onclick="submitBallot('${office.id}')" ${!voterChoice ? 'disabled' : ''}>Submit ballot</button>
    </div>
  `);
}

function selectChoice(candidate) {
  voterChoice = candidate;
  showVoterBallot();
}

async function submitBallot(officeId) {
  const usage = await loadUsage();
  if (!usage[voterCode]) usage[voterCode] = {};
  if (usage[voterCode][officeId]) { showVoterBallot(); return; }
  const votes = await loadVotes(officeId);
  votes.push(voterChoice);
  await setJSON('votes_' + officeId, votes);
  usage[voterCode][officeId] = true;
  await setJSON(USAGE_KEY, usage);
  voterChoice = null;
  showVoterBallot();
}

// Module scripts don't expose top-level functions globally, but inline onclick=""
// handlers in the rendered HTML need them on window.
window.showAdminSetup = showAdminSetup;
window.submitAdminSetup = submitAdminSetup;
window.showAdminGate = showAdminGate;
window.submitAdminGate = submitAdminGate;
window.showHome = showHome;
window.showVoterEntry = showVoterEntry;
window.submitVoterCode = submitVoterCode;
window.selectChoice = selectChoice;
window.submitBallot = submitBallot;
window.addOffice = addOffice;
window.generateCodes = generateCodes;
window.openPortal = openPortal;
window.closePortal = closePortal;
window.openOffice = openOffice;
window.closeOffice = closeOffice;
window.requestClearOfficeVotes = requestClearOfficeVotes;
window.cancelClearOfficeVotes = cancelClearOfficeVotes;
window.clearOfficeVotes = clearOfficeVotes;
window.createRunoff = createRunoff;
window.requestReset = requestReset;
window.cancelReset = cancelReset;
window.doReset = doReset;

showHome();
</script>
